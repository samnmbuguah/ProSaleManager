services:
  app:
    build: .
    container_name: prosale_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=prosalemanager
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=prosaledatabase
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CLIENT_URL=https://prosale.169-58-102-217.sslip.io
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - caddy_default

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_USER=prosalemanager
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=prosaledatabase
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  caddy_default:
    external: true
